name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Bender
        run: |
          curl -sSL https://github.com/pulp-platform/bender/releases/latest/download/bender-x86_64-unknown-linux-gnu.tar.xz \
            | tar -xJ -C /tmp
          mv /tmp/bender-x86_64-unknown-linux-gnu/bender /usr/local/bin/bender

      # This workflow builds directly on main, which (like every branch of
      # this template repo) still has <<NAME>> placeholders throughout --
      # scripts/gen_filelist.sh isn't even valid bash syntax until `make
      # init` replaces them, so there is no real project to document
      # without this step. Publishes documentation for the template's own
      # bundled example design (a saturating pulse counter) as a working
      # demonstration of what this template's docs pipeline produces.
      - name: Initialise example project
        run: make init NAME=pulse_counter TOPLEVEL_HDL=vhdl

      - name: Install Python dependencies
        run: make venv

      - name: Fetch HDL dependencies
        run: make deps

      - name: Generate register files
        run: make regs

      - name: Build HTML documentation
        run: make html PROJECT="${{ github.event.repository.name }}"

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/docs/html/

  # Disabled: fails with "Ensure GitHub Pages has been enabled" until Pages
  # is turned on for this repo (Settings → Pages → Source: GitHub Actions,
  # a one-time manual step no workflow can do on its own). `build` above
  # still runs and succeeds on every push, so documentation builds keep
  # being verified even with deployment off. Re-enable by uncommenting
  # this job once Pages is turned on in Settings.
