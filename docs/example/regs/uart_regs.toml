# uart register map.
#
# Source format: hdl_registers TOML.
# Run `make regs` to generate VHDL packages, C header, and HTML documentation.
# Outputs land in gen/ (gitignored).
#
# Register hierarchy:
#   ctrl      (r_w)    — TX/RX enable and loopback control
#   baud_div  (r_w)    — baud rate divisor (clk_freq / baud_rate)
#   status    (r)      — TX/RX status flags driven by uart_core


# ── ctrl: UART control ────────────────────────────────────────────────────────
[ctrl]
mode = "r_w"
description = "UART control register."

[ctrl.tx_enable]
type = "bit"
description = "Assert to enable the TX serialiser. Deassert to hold TX line idle (high)."
default_value = "0"

[ctrl.rx_enable]
type = "bit"
description = "Assert to enable the RX deserialiser. Deassert to ignore incoming data."
default_value = "0"

[ctrl.loopback]
type = "bit"
description = "Assert to connect TX output internally to RX input (for self-test)."
default_value = "0"


# ── baud_div: Baud rate divisor ───────────────────────────────────────────────
[baud_div]
mode = "r_w"
description = "Baud rate divisor. baud_rate = clk_freq / divisor. Minimum value 2."

[baud_div.divisor]
type = "integer"
description = "Clock cycles per baud period. E.g. 868 for 115200 baud at 100 MHz."
min_value = 2
max_value = 65535
default_value = 868


# ── status: Read-only status ──────────────────────────────────────────────────
[status]
mode = "r"
description = "UART status flags (read-only, driven by uart_core)."

[status.tx_busy]
type = "bit"
description = "Asserted while TX is serialising a byte (start + 8 data + stop bits)."

[status.rx_frame_error]
type = "bit"
description = "Asserted for one clock cycle when RX detects a bad stop bit."

[status.rx_overflow]
type = "bit"
description = "Asserted for one clock cycle when an RX byte arrives before the previous one was consumed."
