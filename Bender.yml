package:
  name: hdl_template
  library: hdl_template  # VHDL library; `make init` sets it to the project name
  authors:
    - "FPGA-James"

# ── External HDL dependencies ─────────────────────────────────────────────────
# Run `make deps` (bender update) to fetch these. hdl-modules has no Bender.yml
# of its own, but Bender still checks it out and resolves its path — see
# `bender path hdl_modules`, used by the Makefile to locate axi_lite_pkg.vhd
# and register_file_pkg.vhd for GHDL library compilation.

dependencies:
  # hdl-modules: VHDL support library required by the hdl_registers AXI-Lite
  # register file generator (axi_lite_pkg, register_file_pkg).
  hdl_modules:
    git: "https://github.com/hdl-modules/hdl-modules.git"
    version: "6.2.1"

# ── Source file declarations ──────────────────────────────────────────────────
# Targets:
#   rtl_vhdl   — VHDL RTL sources (included for VHDL simulation and synthesis)
#   rtl_sv     — SystemVerilog RTL sources
#   gen_vhdl   — Generated VHDL register files (produced by `make regs`)
#   gen_sv     — Generated SystemVerilog register files (produced by `make regs`)
#   tb_vhdl    — VHDL testbench sources (simulation only)

sources:
  # ── VHDL RTL ──────────────────────────────────────────────────────────────
  - target: rtl_vhdl
    files:
      - src/vhdl/<<NAME>>_pkg.vhd
      - src/vhdl/<<NAME>>_core.vhd
      - src/vhdl/<<NAME>>_top.vhd

  # ── Generated VHDL register files (from `make regs`) ──────────────────────
  # These are listed under a separate target so they can be included
  # independently during linting and synthesis.
  - target: gen_vhdl
    files:
      - out/regs/vhdl/<<NAME>>_regs_pkg.vhd
      - out/regs/vhdl/<<NAME>>_register_record_pkg.vhd
      - out/regs/vhdl/<<NAME>>_register_file_axi_lite.vhd

  # ── SystemVerilog RTL ──────────────────────────────────────────────────────
  # axil_if.sv before its consumer: <<NAME>>_top.sv's port is typed using its modport, so the
  # interface must be visible before its consumer is parsed (mirrors the
  # package-before-consumer ordering used for gen_sv below).
  - target: rtl_sv
    files:
      - src/sv/<<NAME>>_pkg.sv
      - src/sv/axil_if.sv
      - src/sv/<<NAME>>_core.sv
      - src/sv/<<NAME>>_top.sv

  # ── SystemVerilog implementation-only sources (optional) ─────────────────────
  # A wrapper with few pins for `make impl` when <<NAME>>_top has more port bits
  # than the package has pins; set IMPL_TOPLEVEL to its module name. Not in rtl_sv,
  # so it does not become a second top level in the docs hierarchy.
  # - target: impl_sv
  #   files:
  #     - synth/<<NAME>>_impl_top.sv

  # ── Generated SystemVerilog register files (from `make regs`) ─────────────
  # Package first: the register file module's ports are typed using the
  # package's struct types, so it must be visible before that module is
  # parsed. Listed under a separate target (mirrors gen_vhdl) so they can be
  # included independently during linting and synthesis.
  - target: gen_sv
    files:
      - out/regs/sv/<<NAME>>_regs_addr_pkg.sv
      - out/regs/sv/<<NAME>>_register_file_axi_lite_pkg.sv
      - out/regs/sv/<<NAME>>_register_file_axi_lite.sv

  # ── VHDL testbench (VUnit, simulation only) ────────────────────────────────
  - target: all(simulation, tb_vhdl)
    files:
      - tb/vunit/vhdl/<<NAME>>_tb.vhd
